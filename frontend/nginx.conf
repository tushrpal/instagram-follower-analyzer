# Nginx configuration for Instagram Follower Tracker frontend

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;
gzip_disable "msie6";

# Brotli compression (if module available)
# brotli on;
# brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

server {
    listen 80;
    server_name instafollowtracker.com www.instafollowtracker.com;
    root /var/www/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets with long cache (versioned files with hashes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # HTML with shorter cache
    location ~* \.(html)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Service worker - no cache
    location ~* (service-worker|sw)\.js$ {
        expires off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # JSON files
    location ~* \.(json)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # API proxy (if backend is on same server)
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing - serve index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
}
